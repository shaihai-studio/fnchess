name: Android 发布构建

# 手动触发（可同时发布到 Google Play 内部测试轨道），或推送 v* 标签自动构建并建 Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（用于 Release 名称，如 v2.0.0.2）'
        required: true
      create_release:
        description: '创建 GitHub Release 并上传产物'
        type: boolean
        default: true
      publish_to_play:
        description: '上传 AAB 到 Google Play（内部测试轨道）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 生成 web 产物并同步到 Android 工程
        run: |
          npm ci
          npm run build:web
          npx cap sync android

      # 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
      #   ANDROID_KEYSTORE_BASE64     —— android/fnchess-release.keystore 的 base64
      #                                  （Windows: certutil -encode fnchess-release.keystore ks.b64）
      #   ANDROID_KEYSTORE_PASSWORD   —— 密钥库口令
      #   ANDROID_KEY_ALIAS           —— 别名（默认 fnchess）
      #   ANDROID_KEY_PASSWORD        —— 密钥口令（与密钥库口令相同即可）
      - name: 写入发布签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/fnchess-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../fnchess-release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 构建签名 AAB + APK
        run: |
          cd android
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: 输出版本信息
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/aapt2
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk | head -1 || true
        working-directory: android

      - name: 上传产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: fnchess-android-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 创建 GitHub Release
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          name: 函数棋 ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      # 可选：上传到 Google Play 内部测试轨道（需配置 GOOGLE_PLAY_SERVICE_ACCOUNT_JSON）
      #   1) Play Console → 设置 → API 访问权限 → 创建服务账号并下载 JSON
      #   2) 把 JSON 全文存入仓库 Secret：GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
      #   3) 手动触发本工作流并勾选 publish_to_play
      - name: 上传 Google Play（内部测试轨道）
        if: ${{ inputs.publish_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cn.shaihai.fnchess
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
