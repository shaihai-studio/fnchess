name: 环境诊断

# 临时诊断用：验证 Actions 是否可用、macOS runner 标签是否有效
on:
  workflow_dispatch:

jobs:
  linux-check:
    name: 验证 Actions 基本可用
    runs-on: ubuntu-latest
    steps:
      - name: 输出环境
        run: |
          echo "Linux runner 可用"
          echo "系统: $(uname -a)"
          echo "当前时间: $(date)"

  macos-check:
    name: 验证 macOS runner 与 Xcode
    runs-on: macos-15
    steps:
      - name: 列出可用 Xcode
        run: |
          echo "macOS 版本: $(sw_vers -productVersion)"
          echo "已安装 Xcode:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "无 Xcode"
          echo "当前 xcode-select:"
          xcode-select -p
          xcodebuild -version 2>/dev/null || echo "xcodebuild 不可用"
