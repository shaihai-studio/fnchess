<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>函数棋关卡编辑器</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(18, 25, 46, 0.9);
      --panel-2: rgba(24, 33, 59, 0.95);
      --line: rgba(148, 163, 184, 0.18);
      --text: #e5eefc;
      --muted: #97a6c6;
      --accent: #7cdb9d;
      --accent-2: #66a6ff;
      --danger: #ff7a7a;
      --warn: #ffd166;
      --radius: 18px;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      --grid: rgba(148, 163, 184, 0.12);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(102,166,255,.18), transparent 35%),
        radial-gradient(circle at top right, rgba(124,219,157,.15), transparent 30%),
        linear-gradient(180deg, #07101f 0%, #0b1020 100%);
    }
    header {
      flex-shrink: 0;
      padding: 10px 20px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 17px; }
    .subtitle { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .wrap {
      flex: 1;
      min-height: 0;
      padding: 0 16px 8px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .left, .center, .right {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .left { overflow-y: auto; }
    .center { overflow: hidden; }
    .right { overflow-y: auto; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }
    .left, .right {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .left { overflow-y: auto; }
    .section { padding: 10px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .section:last-child { border-bottom: 0; }
    .section.stretch { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
    label { display:block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    input, select, textarea, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(9, 13, 26, 0.92);
      color: var(--text);
    }
    input, select, textarea { width: 100%; padding: 6px 8px; outline: none; }
    textarea { min-height: 60px; resize: none; line-height: 1.4; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .btnrow { display:flex; flex-wrap: wrap; gap: 5px; }
    button { padding: 6px 8px; cursor: pointer; font-size: 12px; }
    button.primary { background: linear-gradient(135deg, #2d7dff, #57c7ff); border-color: transparent; color: #fff; }
    button.good { background: linear-gradient(135deg, #2d9b61, #7cdb9d); border-color: transparent; color: #08111c; font-weight: 700; }
    button.ghost { background: rgba(255,255,255,0.04); }
    button.danger { background: rgba(255,122,122,0.12); border-color: rgba(255,122,122,0.3); color: #ffdede; }
    .help { font-size: 10px; color: var(--muted); line-height: 1.4; }
    .toolbar {
      display:flex; gap: 5px; flex-wrap: wrap; align-items: center;
    }
    .toolbar .spacer { flex: 1; }
    .right { overflow: hidden; }
    .canvas-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 6px;
    }
    .canvas-frame {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #050b14;
    }
    canvas { width: 100%; height: 100%; display:block; }
    .legend {
      display:flex; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 10px; flex-shrink: 0;
    }
    .chip { display:inline-flex; align-items:center; gap: 3px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,0.03); font-size: 10px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; display:inline-block; }
    .dot.target { background: var(--accent); }
    .dot.forbid { background: var(--danger); }
    .dot.lock { background: var(--warn); }
    .export-box { min-height: 70px; flex: 1; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; }
    .status { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .list { display:grid; gap: 5px; max-height: 140px; overflow:auto; }
    .item { display:grid; grid-template-columns: 1fr auto; gap: 5px; align-items:center; padding: 6px 8px; border:1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,0.03); font-size: 12px; }
    .item small { color: var(--muted); display:block; margin-top:1px; font-size:10px; }
    .tiny { font-size: 10px; color: var(--muted); }
    .right .export-section {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .right .export-section.stretch {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .right .export-section.stretch .export-box {
      flex: 1;
      min-height: 80px;
      resize: none;
      font-size: 11px;
    }
    .tools-section .btnrow { margin-top: 2px; }
    .tools-section .btnrow button {
      flex: 1;
      min-width: 0;
      padding: 6px 4px;
      font-size: 11px;
    }
    .checkbox-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .checkbox-row label {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
    }
    @media (max-width: 900px) {
      .wrap {
        grid-template-columns: 1fr;
        overflow-y: auto;
      }
      .center { overflow: visible; }
      .right { overflow: visible; }
      .canvas-frame { min-height: 320px; flex: 0 0 auto; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>函数棋关卡编辑器</h1>
      <div class="subtitle">独立 HTML 文件 · 支持整数与非整数坐标 · 可导出到 `campaignLevels.js` 结构</div>
    </div>
    <div class="btnrow">
      <button class="ghost" id="btnLoadSample">加载示例</button>
      <button class="ghost" id="btnCopyOne">复制当前关卡对象</button>
      <button class="good" id="btnExportAll">导出全部关卡文本</button>
    </div>
  </header>

  <div class="wrap">
    <div class="left card">
      <div class="section">
        <label>关卡 ID</label>
        <input id="id" value="1/2" />
        <div class="row" style="margin-top:8px;">
          <div>
            <label>难度</label>
            <input id="difficulty" value="fraction" />
          </div>
          <div>
            <label>nextId</label>
            <input id="nextId" value="1/3" />
          </div>
        </div>
      </div>
      <div class="section">
        <label>targetCells（每行一个，支持小数）</label>
        <textarea id="targetCells"></textarea>
        <div class="tiny">格式示例：<code>{"x": -0.5, "y": 0}</code></div>
      </div>
      <div class="section">
        <label>forbiddenCells（每行一个，支持小数）</label>
        <textarea id="forbiddenCells"></textarea>
      </div>
      <div class="section">
        <label>lockedElements（每行一个）</label>
        <textarea id="lockedElements"></textarea>
      </div>
      <div class="section">
        <label>关卡列表</label>
        <div class="list" id="levelList"></div>
        <div class="toolbar">
          <button class="primary" id="btnAdd">新增空关卡</button>
          <button class="danger" id="btnDelete">删除当前关卡</button>
        </div>
      </div>
    </div>

    <div class="center card">
      <div class="canvas-wrap">
        <div class="legend">
          <span class="chip"><span class="dot target"></span>目标格 targetCells</span>
          <span class="chip"><span class="dot forbid"></span>禁止格 forbiddenCells</span>
          <span class="chip"><span class="dot lock"></span>锁定元素 lockedElements</span>
        </div>
        <div class="canvas-frame">
          <canvas id="gridCanvas"></canvas>
        </div>
      </div>
    </div>

    <div class="right card">
      <div class="section tools-section">
        <label>工具</label>
        <div class="btnrow">
          <button class="ghost" id="btnAddTarget">添加目标格</button>
          <button class="ghost" id="btnAddForbidden">添加禁止格</button>
          <button class="ghost" id="btnAddLock">添加锁定元素</button>
        </div>
        <label style="margin-top:8px;">选项</label>
        <div class="row">
          <div>
            <label>点击精度</label>
            <select id="precisionSelect">
              <option value="2">1/2</option>
              <option value="3">1/3</option>
              <option value="4" selected>1/4</option>
              <option value="5">1/5</option>
              <option value="6">1/6</option>
              <option value="8">1/8</option>
              <option value="10">1/10</option>
            </select>
          </div>
          <div>
            <label>点击基准</label>
            <select id="anchorModeSelect">
              <option value="corner" selected>左下角</option>
              <option value="center">中心</option>
            </select>
          </div>
        </div>
        <div class="checkbox-row">
          <label style="display:flex; align-items:center; gap:5px; margin:0;">
            <input id="boxSelectToggle" type="checkbox" style="width:auto; margin:0;" />
            框选
          </label>
          <label style="display:flex; align-items:center; gap:5px; margin:0;">
            <input id="pathPaintToggle" type="checkbox" style="width:auto; margin:0;" />
            路径涂满
          </label>
        </div>
        <div class="help" style="margin-top:8px;">左键允许、右键禁止；长按拖动可框选或路径涂满。支持 Ctrl+Z 撤回。</div>
      </div>
      <div class="section export-section stretch">
        <label>导出内容</label>
        <textarea id="exportBox" class="export-box" placeholder="点击导出全部关卡文本"></textarea>
        <div class="toolbar">
          <button class="primary" id="btnCopyExport">复制导出文本</button>
          <button class="ghost" id="btnDownload">下载 campaignLevels.js 片段</button>
          <div class="status" id="status"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const sampleLevels = [
      {
        id: '1/2',
        difficulty: 'fraction',
        nextId: '1/3',
        targetCells: [{ x: -0.5, y: 0 }],
        forbiddenCells: [{ x: 0, y: 0.5 }],
        lockedElements: []
      },
      {
        id: '1/3',
        difficulty: 'fraction',
        nextId: '1/4',
        targetCells: [{ x: 0.5, y: 0.5 }],
        forbiddenCells: [{ x: 0, y: 0 }],
        lockedElements: ['+']
      }
    ];

    const state = {
      levels: structuredClone(sampleLevels),
      current: 0,
      dragging: null,
      mode: 'target',
      precision: 4,
      anchorMode: 'corner',
      boxSelectEnabled: false,
      pathPaintEnabled: false,
      history: [],
      historyIndex: -1,
      dragState: null
    };

    const els = Object.fromEntries(['id','difficulty','nextId','targetCells','forbiddenCells','lockedElements','exportBox','levelList','gridCanvas','status','btnLoadSample','btnCopyOne','btnExportAll','btnAdd','btnDelete','btnCopyExport','btnDownload','btnAddTarget','btnAddForbidden','btnAddLock','precisionSelect','boxSelectToggle','pathPaintToggle','anchorModeSelect'].map(id => [id, document.getElementById(id)]));
    const ctx = els.gridCanvas.getContext('2d');

    const parseLines = (text) => text.split('\n').map(s => s.trim()).filter(Boolean);
    const safeJsonArray = (lines) => lines.map(line => JSON.parse(line.replace(/,$/,'').trim()));
    const fmtArr = (arr) => arr.map(v => typeof v === 'string' ? `"${v}"` : JSON.stringify(v)).join(',\n');
    const snap = (n) => Number((Math.round(n * state.precision) / state.precision).toFixed(10));
    const cloneLevels = () => structuredClone(state.levels);
    const pushHistory = () => {
      const snapshot = cloneLevels();
      state.history = state.history.slice(0, state.historyIndex + 1);
      state.history.push(snapshot);
      state.historyIndex = state.history.length - 1;
    };
    const restoreHistory = (index) => {
      if (index < 0 || index >= state.history.length) return;
      state.levels = structuredClone(state.history[index]);
      state.current = Math.min(state.current, state.levels.length - 1);
      state.historyIndex = index;
      syncFormFromLevel();
    };

    function currentLevel() { return state.levels[state.current]; }
    function syncFormFromLevel() {
      const lvl = currentLevel();
      els.id.value = lvl.id ?? '';
      els.difficulty.value = lvl.difficulty ?? '';
      els.nextId.value = lvl.nextId ?? '';
      els.targetCells.value = fmtArr(lvl.targetCells || []);
      els.forbiddenCells.value = fmtArr(lvl.forbiddenCells || []);
      els.lockedElements.value = (lvl.lockedElements || []).map(x => `"${x}"`).join('\n');
      renderList();
      draw();
    }

    function commitFormToLevel() {
      const lvl = currentLevel();
      lvl.id = els.id.value.trim();
      lvl.difficulty = els.difficulty.value.trim();
      lvl.nextId = els.nextId.value.trim() === 'null' || els.nextId.value.trim() === '' ? null : els.nextId.value.trim();
      try { lvl.targetCells = safeJsonArray(parseLines(els.targetCells.value)); } catch {}
      try { lvl.forbiddenCells = safeJsonArray(parseLines(els.forbiddenCells.value)); } catch {}
      try { lvl.lockedElements = parseLines(els.lockedElements.value).map(v => JSON.parse(v)); } catch {}
      renderList();
      draw();
      pushHistory();
    }

    function renderList() {
      els.levelList.innerHTML = '';
      state.levels.forEach((lvl, i) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.style.outline = i === state.current ? '2px solid rgba(124,219,157,.45)' : 'none';
        div.innerHTML = `<div><strong>${lvl.id || '(未命名)'}</strong><small>${(lvl.targetCells||[]).length} 目标 · ${(lvl.forbiddenCells||[]).length} 禁区 · ${(lvl.lockedElements||[]).length} 锁定</small></div><button class="ghost">编辑</button>`;
        div.querySelector('button').onclick = () => { state.current = i; syncFormFromLevel(); };
        els.levelList.appendChild(div);
      });
    }

    function fitCanvas() {
      const rect = els.gridCanvas.parentElement.getBoundingClientRect();
      const dpr = devicePixelRatio || 1;
      els.gridCanvas.width = rect.width * dpr;
      els.gridCanvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function gridMetrics() {
      const w = els.gridCanvas.parentElement.clientWidth;
      const h = els.gridCanvas.parentElement.clientHeight;
      const cellSize = Math.min(w, h) / 20;
      return { w, h, cellSize, originX: w / 2, originY: h / 2 };
    }
    function worldToCanvas(x, y) {
      const { w, h, cellSize, originX, originY } = gridMetrics();
      return { x: originX + x * cellSize, y: originY - y * cellSize, cellSize, w, h };
    }
    function canvasToWorld(px, py) {
      const { w, h, cellSize, originX, originY } = gridMetrics();
      return { x: (px - originX) / cellSize, y: (originY - py) / cellSize, cellSize, w, h };
    }

    function drawGrid() {
      const { w, h, cellSize, originX, originY } = gridMetrics();
      const gridSize = 20 * cellSize;
      const left = originX - gridSize / 2;
      const top = originY - gridSize / 2;
      ctx.clearRect(0,0,w,h);
      // 外圈背景（更暗，提示此处不可交互）
      ctx.fillStyle = '#050b14';
      ctx.fillRect(0,0,w,h);
      // 用 clip 把网格绘制约束到中心 20×20 方块内
      ctx.save();
      ctx.beginPath();
      ctx.rect(left, top, gridSize, gridSize);
      ctx.clip();
      // 方块内背景
      ctx.fillStyle = '#0a1326';
      ctx.fillRect(left, top, gridSize, gridSize);
      // 普通格线
      ctx.strokeStyle = 'rgba(148,163,184,0.2)';
      ctx.lineWidth = 1;
      for (let i = -10; i <= 10; i++) {
        const x = originX + i * cellSize;
        const y = originY - i * cellSize;
        ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, top + gridSize); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(left + gridSize, y); ctx.stroke();
      }
      // 中心轴高亮
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(originX, top); ctx.lineTo(originX, top + gridSize); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(left, originY); ctx.lineTo(left + gridSize, originY); ctx.stroke();
      ctx.restore();
      // 方块外边框
      ctx.strokeStyle = 'rgba(148,163,184,0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(left, top, gridSize, gridSize);
    }

    function drawCellRect(p, color, label) {
      const { cellSize, w, h } = gridMetrics();
      const left = w / 2 + p.x * cellSize;
      const top = h / 2 - (p.y + 1) * cellSize;
      ctx.fillStyle = color;
      ctx.fillRect(left, top, cellSize, cellSize);
      ctx.strokeStyle = 'rgba(255,255,255,.5)';
      ctx.strokeRect(left, top, cellSize, cellSize);
      ctx.fillStyle = '#fff';
      ctx.font = '12px ui-monospace, monospace';
      ctx.fillText(label, left + 4, top + 14);
    }

    function drawSelectionRect(sel) {
      if (!sel) return;
      const { cellSize, w, h } = gridMetrics();
      const x1 = Math.min(sel.start.x, sel.end.x);
      const x2 = Math.max(sel.start.x, sel.end.x);
      const y1 = Math.min(sel.start.y, sel.end.y);
      const y2 = Math.max(sel.start.y, sel.end.y);
      const left = w / 2 + x1 * cellSize;
      const right = w / 2 + (x2 + 1) * cellSize;
      const top = h / 2 - (y2 + 1) * cellSize;
      const bottom = h / 2 - y1 * cellSize;
      ctx.fillStyle = 'rgba(102,166,255,0.18)';
      ctx.fillRect(left, top, right - left, bottom - top);
      ctx.strokeStyle = 'rgba(102,166,255,0.8)';
      ctx.lineWidth = 2;
      ctx.strokeRect(left, top, right - left, bottom - top);
    }

    function draw() {
      drawGrid();
      const lvl = currentLevel();
      (lvl.targetCells || []).forEach((p, i) => drawCellRect(p, 'rgba(124,219,157,0.45)', `T${i+1}`));
      (lvl.forbiddenCells || []).forEach((p, i) => drawCellRect(p, 'rgba(255,122,122,0.45)', `F${i+1}`));
      drawSelectionRect(state.dragState?.selecting ? state.dragState : null);
      ctx.fillStyle = '#ffd166';
      ctx.font = '13px ui-monospace, monospace';
      (lvl.lockedElements || []).forEach((s, i) => ctx.fillText(`锁 ${i+1}: ${s}`, 16, 24 + i * 18));
    }

    function exportLevel(lvl) {
      const nextId = lvl.nextId === '' ? null : lvl.nextId;
      return `{
                       "id":  "${lvl.id}",
                       "difficulty":  "${lvl.difficulty}",
                       "nextId":  ${nextId === null ? 'null' : `"${nextId}"`},
                       "targetCells":  ${JSON.stringify(lvl.targetCells, null, 4).replace(/\n/g, '\n                                           ')},
                       "forbiddenCells":  ${JSON.stringify(lvl.forbiddenCells, null, 4).replace(/\n/g, '\n                                            ')},
                       "lockedElements":  ${JSON.stringify(lvl.lockedElements, null, 4).replace(/\n/g, '\n                                              ')}
                   }`;
    }

    function snapLevelPoints(level) {
      return level;
    }

    function exportAll() {
      const out = state.levels.map((lvl, i) => exportLevel(lvl) + (i < state.levels.length - 1 ? ',' : '')).join('\n                   ');
      els.exportBox.value = out;
      setStatus(`已导出 ${state.levels.length} 个关卡`);
      return out;
    }

    function setStatus(msg) { els.status.textContent = msg; }

    els.precisionSelect.onchange = () => {
      state.precision = Number(els.precisionSelect.value);
      setStatus(`点击精度已切换到 1/${state.precision}`);
    };
    els.anchorModeSelect.onchange = () => {
      state.anchorMode = els.anchorModeSelect.value;
      setStatus(state.anchorMode === 'center' ? '点击基准：中心' : '点击基准：左下角');
    };
    els.boxSelectToggle.onchange = () => {
      state.boxSelectEnabled = els.boxSelectToggle.checked;
      setStatus(state.boxSelectEnabled ? '框选已开启' : '框选已关闭');
    };
    els.pathPaintToggle.onchange = () => {
      state.pathPaintEnabled = els.pathPaintToggle.checked;
      setStatus(state.pathPaintEnabled ? '路径涂满已开启' : '路径涂满已关闭');
    };

    els.id.oninput = els.difficulty.oninput = els.nextId.oninput = () => { commitFormToLevel(); };
    els.targetCells.oninput = els.forbiddenCells.oninput = els.lockedElements.oninput = () => { commitFormToLevel(); };

    els.btnLoadSample.onclick = () => { state.levels = structuredClone(sampleLevels); state.current = 0; syncFormFromLevel(); setStatus('已加载示例关卡'); pushHistory(); };
    els.btnAdd.onclick = () => { state.levels.push({ id: `new-${state.levels.length+1}`, difficulty: 'fraction', nextId: null, targetCells: [], forbiddenCells: [], lockedElements: [] }); state.current = state.levels.length - 1; syncFormFromLevel(); pushHistory(); };
    els.btnDelete.onclick = () => { if (state.levels.length <= 1) return setStatus('至少保留一个关卡'); state.levels.splice(state.current,1); state.current = Math.max(0, state.current - 1); syncFormFromLevel(); pushHistory(); };
    els.btnExportAll.onclick = () => exportAll();
    els.btnCopyExport.onclick = async () => { const text = exportAll(); await navigator.clipboard.writeText(text); setStatus('导出文本已复制'); };
    els.btnDownload.onclick = () => { const text = `[
${exportAll()}
]`; const blob = new Blob([text], { type: 'text/javascript;charset=utf-8' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'campaignLevels.fragment.js'; a.click(); URL.revokeObjectURL(a.href); };
    els.btnCopyOne.onclick = async () => { const text = exportLevel(currentLevel()); await navigator.clipboard.writeText(text); setStatus('当前关卡对象已复制'); };
    els.btnAddTarget.onclick = () => { currentLevel().targetCells.push({ x: 0, y: 0 }); syncFormFromLevel(); pushHistory(); };
    els.btnAddForbidden.onclick = () => { currentLevel().forbiddenCells.push({ x: 0, y: 0 }); syncFormFromLevel(); pushHistory(); };
    els.btnAddLock.onclick = () => { currentLevel().lockedElements.push('+'); syncFormFromLevel(); pushHistory(); };

    const quantizeToPrecision = (n) => snap(n);
    const cellFromEvent = (e) => {
      const rect = els.gridCanvas.getBoundingClientRect();
      const p = canvasToWorld(e.clientX - rect.left, e.clientY - rect.top);
      const offset = state.anchorMode === 'center' ? -0.5 : 0;
      return { x: quantizeToPrecision(p.x + offset), y: quantizeToPrecision(p.y + offset) };
    };
    const gridCellFromEvent = (e) => {
      const rect = els.gridCanvas.getBoundingClientRect();
      const p = canvasToWorld(e.clientX - rect.left, e.clientY - rect.top);
      return { x: Math.floor(p.x), y: Math.floor(p.y) };
    };
    const sameCell = (a, b) => a.x === b.x && a.y === b.y;
    const removeCellAt = (level, cell) => {
      const targetIndex = (level.targetCells || []).findIndex(p => sameCell(p, cell));
      if (targetIndex !== -1) {
        level.targetCells.splice(targetIndex, 1);
        return 'target';
      }
      const forbiddenIndex = (level.forbiddenCells || []).findIndex(p => sameCell(p, cell));
      if (forbiddenIndex !== -1) {
        level.forbiddenCells.splice(forbiddenIndex, 1);
        return 'forbidden';
      }
      return null;
    };
    const addCellAt = (level, cell, type) => {
      const existingType = removeCellAt(level, cell);
      if (existingType === type) return;
      if (existingType && existingType !== type) {
        if (type === 'target') level.targetCells.push(cell); else level.forbiddenCells.push(cell);
        return;
      }
      if (type === 'target') level.targetCells.push(cell); else level.forbiddenCells.push(cell);
    };
    const addCellRange = (start, end, type) => {
      const lvl = currentLevel();
      const xs = [Math.floor(Math.min(start.x, end.x)), Math.floor(Math.max(start.x, end.x))];
      const ys = [Math.floor(Math.min(start.y, end.y)), Math.floor(Math.max(start.y, end.y))];
      for (let x = xs[0]; x <= xs[1]; x++) {
        for (let y = ys[0]; y <= ys[1]; y++) {
          addCellAt(lvl, { x, y }, type);
        }
      }
    };
    const addPathCells = (start, end, type) => {
      const lvl = currentLevel();
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const steps = Math.max(Math.abs(dx), Math.abs(dy)) * state.precision * 4;
      const count = Math.max(1, Math.ceil(steps));
      const visited = new Set();
      for (let i = 0; i <= count; i++) {
        const t = count === 0 ? 0 : i / count;
        const x = snap(start.x + dx * t);
        const y = snap(start.y + dy * t);
        const key = `${x},${y}`;
        if (visited.has(key)) continue;
        visited.add(key);
        addCellAt(lvl, { x, y }, type);
      }
    };
    const startSelection = (e, type) => {
      const start = gridCellFromEvent(e);
      state.dragState = {
        type,
        start,
        end: start,
        selecting: true,
        moved: false,
        pathMode: state.pathPaintEnabled,
        button: e.button,
        startX: e.clientX,
        startY: e.clientY,
        longPressTimer: null,
        committed: false
      };
      if (!state.boxSelectEnabled && !state.pathPaintEnabled) {
        addCellAt(currentLevel(), start, type);
        syncFormFromLevel();
        pushHistory();
        state.dragState.committed = true;
      }
      state.dragState.longPressTimer = window.setTimeout(() => {
        if (state.dragState && state.boxSelectEnabled) state.dragState.selecting = true;
      }, 180);
      draw();
    };
    const finishSelection = () => {
      const s = state.dragState;
      if (!s) return;
      clearTimeout(s.longPressTimer);
      if (s.committed) {
        state.dragState = null;
        draw();
        return;
      }
      if (s.pathMode && s.moved) {
        addPathCells(s.start, s.end, s.type);
        syncFormFromLevel();
        pushHistory();
      } else if (s.selecting && s.moved && state.boxSelectEnabled) {
        addCellRange(s.start, s.end, s.type);
        syncFormFromLevel();
        pushHistory();
      } else if ((state.boxSelectEnabled || s.pathMode) && !s.moved) {
        addCellAt(currentLevel(), s.start, s.type);
        syncFormFromLevel();
        pushHistory();
      }
      state.dragState = null;
      draw();
    };

    els.gridCanvas.addEventListener('contextmenu', (e) => e.preventDefault());
    els.gridCanvas.addEventListener('pointerdown', (e) => {
      if (!state.boxSelectEnabled && !state.pathPaintEnabled) return;
      if (e.button !== 0 && e.button !== 2) return;
      e.preventDefault();
      els.gridCanvas.setPointerCapture(e.pointerId);
      startSelection(e, e.button === 0 ? 'target' : 'forbidden');
    });
    els.gridCanvas.addEventListener('pointermove', (e) => {
      if (!state.dragState || (!state.boxSelectEnabled && !state.pathPaintEnabled)) return;
      const dx = Math.abs(e.clientX - state.dragState.startX);
      const dy = Math.abs(e.clientY - state.dragState.startY);
      if (dx > 4 || dy > 4) state.dragState.moved = true;
      state.dragState.end = gridCellFromEvent(e);
      draw();
    });
    els.gridCanvas.addEventListener('pointerup', (e) => {
      if (!state.boxSelectEnabled && !state.pathPaintEnabled) return;
      if (state.dragState) {
        try { els.gridCanvas.releasePointerCapture(e.pointerId); } catch {}
        finishSelection();
      }
    });
    els.gridCanvas.addEventListener('click', (e) => {
      if (state.boxSelectEnabled || state.pathPaintEnabled) return;
      const point = cellFromEvent(e);
      addCellAt(currentLevel(), point, 'target');
      syncFormFromLevel();
      pushHistory();
    });
    els.gridCanvas.addEventListener('contextmenu', (e) => {
      if (state.boxSelectEnabled || state.pathPaintEnabled) return;
      e.preventDefault();
      const point = cellFromEvent(e);
      addCellAt(currentLevel(), point, 'forbidden');
      syncFormFromLevel();
      pushHistory();
    });

    window.addEventListener('resize', fitCanvas);
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); exportAll(); }
      if (e.ctrlKey && e.key.toLowerCase() === 'z') { e.preventDefault(); restoreHistory(state.historyIndex - 1); }
    });

    state.levels = structuredClone(sampleLevels);
    syncFormFromLevel();
    fitCanvas();
    exportAll();
    pushHistory();
  </script>
</body>
</html>
