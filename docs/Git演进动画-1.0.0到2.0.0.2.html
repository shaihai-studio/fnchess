// ---------- 工具 ----------
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    this.moveTo(x+r, y);
    this.arcTo(x+w, y, x+w, y+h, r);
    this.arcTo(x+w, y+h, x, y+h, r);
    this.arcTo(x, y+h, x, y, r);
    this.arcTo(x, y, x+w, y, r);
    this.closePath();
    return this;
  };
}
const easeInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; // 慢-快-慢
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const N = DATA.commits.length;
const BRANCH_COLORS = ['#f472b6','#a78bfa','#f59e0b','#34d399','#fb7185','#eab308','#22c55e','#38bdf8'];
const MERGE_COLOR = '#f59e0b';
const NODE_ACTIVE = '#22d3ee';
const NODE_IDLE = 'rgba(71,105,145,0.55)';
const DURATION = 5000;
const HOLD = 1200;
const DY = 34;            // 纵向节点间距（世界单位）
const FOCUS_Y = 0.62;     // 光标锁定的屏幕纵向位置（占比，偏下 → 起点在下方，从下往上滚）

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const pctEl = document.getElementById('pct');

let W=0, H=0, DPR=1;
const layout = { trunkX: 0, y: [], camY: 0 };
let stars = [];

function resize() {
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout.trunkX = Math.round(W*0.5);
  layout.y = Array.from({length:N}, (_,i)=> (N-1-i)*DY);  // 反转：1.0.0 在最下方，向上演进
  stars = Array.from({length:120}, ()=> ({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.1+0.3, a: Math.random()*0.32+0.07, tw: Math.random()*6.28
  }));
}
window.addEventListener('resize', resize);
resize();

function worldY(idx) {
  const i0 = clamp(Math.floor(idx), 0, N-2);
  const f = clamp(idx - i0, 0, 1);
  return lerp(layout.y[i0], layout.y[i0+1], f);
}
function camYFor(idx){ return worldY(idx) - H*FOCUS_Y; }

// ---------- 绘制 ----------
function drawBackground(t) {
  const g = ctx.createRadialGradient(W/2, H*0.30, 80, W/2, H/2, Math.max(W,H)*0.8);
  g.addColorStop(0, '#0b1830');
  g.addColorStop(0.55, '#070e1e');
  g.addColorStop(1, '#04070f');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
  for (const s of stars) {
    const tw = 0.6 + 0.4*Math.sin(t*0.0012 + s.tw);
    ctx.globalAlpha = s.a*tw;
    ctx.fillStyle = '#cfe8ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 上下淡出带（景深）
  const topG = ctx.createLinearGradient(0,0,0,H*0.20);
  topG.addColorStop(0,'rgba(4,7,15,0.9)'); topG.addColorStop(1,'rgba(4,7,15,0)');
  ctx.fillStyle = topG; ctx.fillRect(0,0,W,H*0.20);
  const botG = ctx.createLinearGradient(0,H*0.86,0,H);
  botG.addColorStop(0,'rgba(4,7,15,0)'); botG.addColorStop(1,'rgba(4,7,15,0.92)');
  ctx.fillStyle = botG; ctx.fillRect(0,H*0.86,W,H*0.14);
}

function drawBranches() {
  DATA.branches.forEach((b, bi) => {
    const span = Math.min(6, b.idx);
    const start = Math.max(0, b.idx - span);
    const y0 = layout.y[start], y1 = layout.y[b.idx];
    const side = bi % 2 === 0 ? -1 : 1;   // 左右交替
    const amp = 78 + (b.name.length % 3) * 24;
    const c1x = layout.trunkX + side*amp, c2x = layout.trunkX + side*amp;
    ctx.strokeStyle = BRANCH_COLORS[bi % BRANCH_COLORS.length];
    ctx.lineWidth = 1.5; ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.moveTo(layout.trunkX, y0);
    ctx.bezierCurveTo(c1x, y0, c2x, y1, layout.trunkX, y1);
    ctx.stroke();
    // 分支提交小点
    for (let k=1; k<=3; k++) {
      const tt = k/4;
      const bpx = (1-tt)**3*layout.trunkX + 3*(1-tt)**2*tt*c1x + 3*(1-tt)*tt*tt*c2x + tt**3*layout.trunkX;
      const bpy = (1-tt)**3*y0 + 3*(1-tt)**2*tt*y0 + 3*(1-tt)*tt*tt*y1 + tt**3*y1;
      ctx.fillStyle = BRANCH_COLORS[bi % BRANCH_COLORS.length];
      ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.arc(bpx, bpy, 2.3, 0, 6.283); ctx.fill();
    }
    // 分支名（弧线外侧）
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = BRANCH_COLORS[bi % BRANCH_COLORS.length];
    ctx.font = '10.5px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.textAlign = side < 0 ? 'right' : 'left';
    const nx = clamp(layout.trunkX + side*(amp + 34), 46, W-46);
    ctx.fillText(b.name, nx, (y0+y1)/2 + 3);
    ctx.globalAlpha = 1;
  });
}

function drawTrunkLine(progressIdx) {
  const yEnd = worldY(progressIdx);
  // 未走部分
  ctx.strokeStyle = 'rgba(56,94,140,0.35)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(layout.trunkX, layout.y[0]);
  ctx.lineTo(layout.trunkX, layout.y[N-1]);
  ctx.stroke();
  // 已走部分
  if (progressIdx > 0.01) {
    const g = ctx.createLinearGradient(0, layout.y[0], 0, Math.max(yEnd, layout.y[1]));
    g.addColorStop(0, 'rgba(14,165,233,0.9)');
    g.addColorStop(1, 'rgba(103,232,249,0.95)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(layout.trunkX, layout.y[0]);
    ctx.lineTo(layout.trunkX, yEnd);
    ctx.stroke();
  }
}

function drawNodes(progressIdx, elapsed) {
  for (let i=0; i<N; i++) {
    const isMerge = DATA.branches.some(b=>b.idx===i);
    const isMilestone = DATA.milestones.some(m=>m.idx===i);
    const passed = i <= progressIdx;
    const near = Math.abs(i - progressIdx) < 1;
    let r = 3.2;
    if (isMilestone) r = 5.2;
    else if (isMerge) r = 4;
    if (isMilestone && passed) {
      ctx.fillStyle = '#a5f3fc';
      ctx.shadowColor = 'rgba(34,211,238,0.9)'; ctx.shadowBlur = 12;
    } else if (passed) {
      ctx.fillStyle = isMerge ? MERGE_COLOR : NODE_ACTIVE;
      ctx.shadowColor = isMerge ? 'rgba(245,158,11,0.8)' : 'rgba(34,211,238,0.8)';
      ctx.shadowBlur = near ? 14 : 7;
    } else {
      ctx.fillStyle = isMilestone ? 'rgba(125,211,252,0.65)' : NODE_IDLE;
      ctx.shadowBlur = 0;
    }
    ctx.beginPath();
    ctx.arc(layout.trunkX, layout.y[i], r, 0, 6.283);
    ctx.fill();
    ctx.shadowBlur = 0;
    // 里程碑标签（左右交错；当前节点由光标信息条展示，跳过避免重叠）
    if (isMilestone) {
      if (i === Math.round(progressIdx)) continue;
      const m = DATA.milestones.find(x=>x.idx===i);
      const left = (i % 2 === 1) && i !== N-1;
      const tx = clamp(layout.trunkX + (left ? -12 : 12), 30, W-30);
      ctx.textAlign = left ? 'right' : 'left';
      ctx.font = '600 11.5px "Segoe UI","Microsoft YaHei",sans-serif';
      ctx.fillStyle = passed ? '#7dd3fc' : 'rgba(125,211,252,0.5)';
      ctx.fillText(m.label, tx, layout.y[i] - 3);
      ctx.font = '9.5px "Segoe UI","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(148,163,184,0.4)';
      ctx.fillText(DATA.commits[i].d, tx, layout.y[i] + 11);
    }
  }
}

function drawCursorScreen(progressIdx, elapsed) {
  const x = layout.trunkX;
  const y = H*FOCUS_Y;
  const pulse = 1 + 0.12*Math.sin(elapsed*0.012);
  // 外光晕
  const g = ctx.createRadialGradient(x, y, 1, x, y, 30*pulse);
  g.addColorStop(0, 'rgba(186,240,255,0.85)');
  g.addColorStop(0.35, 'rgba(56,189,248,0.35)');
  g.addColorStop(1, 'rgba(56,189,248,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, 30*pulse, 0, 6.283); ctx.fill();
  // 核心
  ctx.fillStyle = '#e0f7ff';
  ctx.shadowColor = '#7dd3fc'; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.arc(x, y, 4.8*pulse, 0, 6.283); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(x, y, 8, 0, 6.283); ctx.stroke();
  // 左侧：日期在左、ID 在右（单行）
  const ci = Math.round(progressIdx);
  const c = DATA.commits[ci];
  ctx.font = '10px "Segoe UI","Microsoft YaHei",sans-serif';
  const dateTxt = c.d;
  const dw = ctx.measureText(dateTxt).width;
  ctx.font = '600 13px "Consolas","Courier New",monospace';
  const hashTxt = c.h;
  const hw = ctx.measureText(hashTxt).width;
  const gap = 10;
  const lw = dw + gap + hw + 26;
  const lx = Math.max(12, x - 20 - lw);
  ctx.fillStyle = 'rgba(6,14,28,0.9)';
  ctx.strokeStyle = 'rgba(56,189,248,0.45)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(lx, y-15, lw, 30, 8);
  ctx.fill(); ctx.stroke();
  // 日期（左）
  ctx.fillStyle = 'rgba(148,163,184,0.85)';
  ctx.font = '10px "Segoe UI","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(dateTxt, lx+13, y+3);
  // ID（右）
  ctx.fillStyle = '#7dd3fc';
  ctx.font = '600 13px "Consolas","Courier New",monospace';
  ctx.fillText(hashTxt, lx + 13 + dw + gap, y+3);

  // 右侧：提交标题（里程碑节点带版本徽标）
  const isMilestone = DATA.milestones.some(m=>m.idx===ci);
  const mil = DATA.milestones.find(m=>m.idx===ci);
  const badgeW = isMilestone ? 48 : 0;
  const maxRightW = Math.max(90, W - (x + 20) - 16);
  let msg = c.s;
  ctx.font = '600 12.5px "Segoe UI","Microsoft YaHei",sans-serif';
  let mw = ctx.measureText(msg).width;
  while (mw + badgeW + 26 > maxRightW && msg.length > 4) {
    msg = msg.slice(0, -1);
    mw = ctx.measureText(msg + '…').width;
  }
  if (msg !== c.s) msg += '…';
  const rw = mw + badgeW + 26;
  const rx = x + 20;
  ctx.fillStyle = 'rgba(6,14,28,0.9)';
  ctx.strokeStyle = isMilestone ? 'rgba(245,158,11,0.5)' : 'rgba(56,189,248,0.45)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(rx, y-19, rw, 32, 8);
  ctx.fill(); ctx.stroke();
  if (isMilestone) {
    ctx.fillStyle = 'rgba(245,158,11,0.2)';
    ctx.beginPath();
    ctx.roundRect(rx+5, y-13, 40, 21, 5);
    ctx.fill();
    ctx.fillStyle = '#fbbf24';
    ctx.font = '600 10.5px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(mil.label, rx+25, y+3);
  }
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '600 12.5px "Segoe UI","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(msg, rx + badgeW + (isMilestone ? 2 : 13), y+3);
}

// ---------- 动画循环 ----------
let startTime = 0, playing = false;
function frame(now) {
  if (!playing) {
    if (now - startTime > HOLD) { startTime = now; playing = true; }
    drawScene(now, 1);
    requestAnimationFrame(frame);
    return;
  }
  const el = now - startTime;
  const t = clamp(el / DURATION, 0, 1);
  const e = easeInOut(t);
  drawScene(now, e);
  if (t >= 1) { playing = false; startTime = now; pctEl.textContent = '100%'; }
  requestAnimationFrame(frame);
}

function drawScene(now, e) {
  drawBackground(now);
  const progressIdx = e * (N-1);
  ctx.save();
  ctx.translate(0, -camYFor(progressIdx));   // 相机锁定光标
  drawBranches();
  drawTrunkLine(progressIdx);
  drawNodes(progressIdx, now);
  ctx.restore();
  drawCursorScreen(progressIdx, now);        // 光标固定在屏幕
  const pct = Math.round(e*100);
  document.getElementById('bar-fill').style.width = pct + '%';
  if (playing) pctEl.textContent = pct + '% · ' + progressIdx.toFixed(1) + '/' + (N-1);
}
requestAnimationFrame(frame);
</script>
</body>
