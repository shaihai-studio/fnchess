<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>thin progress test</title>
<style>
:root {
  --rb-primary:#22d3ee; --rb-blue:#38bdf8; --rb-green:#4ade80; --rb-amber:#f59e0b;
  --rb-red:#f87171; --rb-dim:#94a3b8; --rb-panel2:rgba(15,23,42,.6);
}
body{background:#0a0f1e;margin:0;padding:60px 8px;font-family:sans-serif;}
.race-battle-panel {
    position:fixed; top:8px; left:50%; transform:translateX(-50%);
    width:min(620px, calc(100vw - 16px)); z-index:1200;
    background:linear-gradient(180deg, rgba(7,13,26,.92), rgba(15,23,42,.85));
    border:1px solid rgba(34,211,238,.35); border-radius:14px;
    backdrop-filter:blur(10px); padding:8px 12px;
    box-shadow:0 4px 30px rgba(0,0,0,.5), 0 0 20px rgba(34,211,238,.12);
}
.race-battle-panel-head {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-bottom:6px; margin-bottom:6px;
    border-bottom:1px solid rgba(148,163,184,.15);
}
.race-battle-panel-title { font-size:13px; font-weight:700; color:var(--rb-primary); }
.race-battle-panel-collapse { font-size:12px; line-height:1; padding:3px 7px; border-radius:6px; cursor:pointer; color:var(--rb-dim); background:var(--rb-panel2); border:1px solid rgba(148,163,184,.3); }
.race-battle-panel.is-collapsed { padding:4px 10px; }
.race-battle-panel.is-collapsed .race-battle-panel-head { padding-bottom:0; margin-bottom:0; border-bottom:none; }
.race-battle-panel.is-collapsed .race-battle-rows,
.race-battle-panel.is-collapsed .race-battle-feature-line,
.race-battle-panel.is-collapsed .race-battle-wait-hint { display:none; }
.race-battle-progress-thin {
    display:none;
    height:2px;
    margin-top:2px;
    border-radius:1px;
    width:100%;
    overflow:hidden;
    background:rgba(148,163,184,.12);
}
.race-battle-panel.is-collapsed .race-battle-progress-thin { display:flex; }
.rb-progress-thin-seg { flex:1 1 0; min-width:0; position:relative; height:100%; }
.rb-progress-thin-seg + .rb-progress-thin-seg { border-left:1px solid rgba(148,163,184,.28); }
.rb-progress-thin-fill { position:absolute; left:0; top:0; bottom:0; border-radius:1px; background:rgba(255,255,255,.55); transition:width .3s ease; }
.rb-progress-thin-seg.is-me .rb-progress-thin-fill { background:linear-gradient(90deg, var(--rb-primary), var(--rb-blue)); box-shadow:0 0 8px rgba(34,211,238,.5); }
.rb-progress-thin-seg.is-offline .rb-progress-thin-fill { background:rgba(148,163,184,.35); }
.race-battle-panel-code { font-family:Consolas,monospace; font-size:12px; color:var(--rb-dim); letter-spacing:2px; }
.race-battle-panel-timer { font-size:15px; font-weight:700; color:var(--rb-blue); font-family:Consolas,monospace; margin-left:auto; }
.race-battle-wait-hint { display:none; font-size:12px; font-weight:600; color:var(--rb-amber); padding:2px 10px; border-radius:999px; background:rgba(245,158,11,.15); border:1px solid rgba(245,158,11,.4); }
.race-battle-panel-exit { font-size:12px; padding:4px 12px; border-radius:8px; cursor:pointer; color:var(--rb-dim); background:var(--rb-panel2); border:1px solid rgba(148,163,184,.3); }
.race-battle-rows { display:flex; flex-direction:column; gap:6px; max-height:42vh; overflow-y:auto; }
.race-battle-row { display:grid; grid-template-columns:22px minmax(48px,1fr) minmax(62px,1.2fr) minmax(78px,1.6fr) 56px; align-items:center; gap:6px; padding:5px 7px; border-radius:10px; background:rgba(7,13,26,.45); }
.race-battle-feature-line { display:none; }
</style>
</head>
<body>
<div class="race-battle-panel is-collapsed" id="race-battle-panel">
    <div class="race-battle-panel-head">
        <span class="race-battle-panel-title">⚡ 竞速对战</span>
        <button class="race-battle-panel-collapse" id="race-battle-panel-collapse">▸</button>
        <span class="race-battle-panel-code" id="race-battle-panel-code">------</span>
        <span class="race-battle-panel-timer" id="race-battle-panel-timer">0.00s</span>
        <span class="race-battle-wait-hint" id="race-battle-wait-hint" style="display:none;">等待重连…</span>
        <button class="race-battle-panel-exit" id="race-battle-panel-exit">退出</button>
        <button class="race-battle-panel-exit rb-finish-exit-btn" id="race-battle-finish-exit-btn" style="display:none;">退出结算</button>
        <button class="race-battle-panel-exit rb-finish-watch-btn" id="race-battle-finish-watch-btn" style="display:none;">继续观战</button>
    </div>
    <div class="race-battle-progress-thin" id="race-battle-progress-thin"></div>
    <div class="race-battle-rows" id="race-battle-rows" style="display:none;"></div>
    <div class="race-battle-feature-line" id="race-battle-feature-line"></div>
</div>
<script>
const thin = document.getElementById('race-battle-progress-thin');
const totalLv = 3;
const players = [
  { id:'a', name:'玩家A', level:1, puzzle:4, finished:false },
  { id:'b', name:'玩家B', level:2, puzzle:7, finished:false },
  { id:'c', name:'玩家C', level:3, puzzle:2, finished:false },
  { id:'d', name:'玩家D', level:2, puzzle:0, finished:false },
];
players.forEach((p, i) => {
  const seg = document.createElement('span');
  seg.className = 'rb-progress-thin-seg' + (p.id === 'b' ? ' is-me' : '');
  const fill = document.createElement('span');
  fill.className = 'rb-progress-thin-fill';
  const pct = p.finished ? totalLv : ((p.level || 1) - 1) + ((p.puzzle || 0) / 10);
  fill.style.width = Math.round(Math.max(0, Math.min(1, pct / totalLv)) * 100) + '%';
  seg.appendChild(fill);
  thin.appendChild(seg);
});
</script>
</body>
</html>
